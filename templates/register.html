<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask App - Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
    <div class="login-container">
        <h1>Create Account</h1>
        
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        
        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-group">
                <label for="first_name">First Name</label>
                <input type="text" id="first_name" name="first_name" required>
            </div>
            
            <div class="form-group">
                <label for="last_name">Last Name</label>
                <input type="text" id="last_name" name="last_name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="username">User name</label>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div class="form-group">
                <label for="contact_number">Contact Number</label>
                <input type="tel" id="contact_number" name="contact_number" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
            </div>
            
            <div class="form-group">
                <label for="captcha">Verify you're human</label>
                <div class="captcha-container">
                    <canvas id="captcha-canvas" width="200" height="60"></canvas>
                    <button type="button" class="captcha-refresh" onclick="generateCaptcha()" title="Refresh CAPTCHA">&#x21bb;</button>
                </div>
                <input type="text" id="captcha" name="captcha" required placeholder="Enter the code shown above">
            </div>
            
            <button type="submit" class="btn">Register</button>
        </form>
        
        <script>
            let currentCaptcha = '';
            
            function generateCaptcha() {
                const canvas = document.getElementById('captcha-canvas');
                const ctx = canvas.getContext('2d');
                const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#f8f9fa';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                for (let i = 0; i < 3; i++) {
                    ctx.strokeStyle = `rgba(${Math.random()*255},${Math.random()*255},${Math.random()*255},0.3)`;
                    ctx.beginPath();
                    ctx.moveTo(Math.random() * canvas.width, Math.random() * canvas.height);
                    ctx.lineTo(Math.random() * canvas.width, Math.random() * canvas.height);
                    ctx.stroke();
                }
                
                currentCaptcha = '';
                for (let i = 0; i < 6; i++) {
                    currentCaptcha += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                
                for (let i = 0; i < 6; i++) {
                    ctx.font = `${20 + Math.random() * 10}px Arial`;
                    ctx.fillStyle = `rgb(${Math.random()*100},${Math.random()*100},${Math.random()*100})`;
                    ctx.save();
                    ctx.translate(20 + i * 28, 35);
                    ctx.rotate((Math.random() - 0.5) * 0.4);
                    ctx.fillText(currentCaptcha[i], 0, 0);
                    ctx.restore();
                }
                
                document.getElementById('captcha').value = '';
            }
            
            generateCaptcha();
            
            document.querySelector('form').addEventListener('submit', function(e) {
                const userInput = document.getElementById('captcha').value;
                if (userInput !== currentCaptcha) {
                    e.preventDefault();
                    alert('Invalid CAPTCHA. Please try again.');
                    generateCaptcha();
                }
            });
        </script>
        
        <p style="text-align: center; margin-top: 20px; color: #666;">
            Already have an account? <a href="{{ url_for('login') }}" style="color: #667eea; text-decoration: none; font-weight: 600;">Login here</a>
        </p>
    </div>
</body>
</html>
